[package]
name = "rustcord"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "A native, customisable Discord client written in Rust"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
base64 = "0.22"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "persistence", "default_fonts", "system_fonts", "accesskit", "clipboard", "links", "wayland", "x11"] }
egui_extras = { version = "0.37", features = ["all_loaders", "http"] }
egui_tiles = { version = "0.18", features = ["serde"] }
emojis = "0.9.1"
flate2 = "1.1.11"
futures-util = "0.3.34"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
memory-stats = "1.2.0"
notify-rust = "4.19.0"
prost = { version = "0.14", default-features = false, features = ["derive", "std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "multipart", "stream"] }
rfd = "0.18.0"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
unicode-segmentation = "1.13.3"

# Smaller, faster release builds.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
