[package]
name = "rustcord"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "A native, customisable Discord client written in Rust"

[dependencies]
anyhow = "1.0.104"
eframe = { version = "0.37.0", features = ["persistence"] }
egui_extras = { version = "0.37", features = ["all_loaders", "http"] }
egui_tiles = { version = "0.18", features = ["serde"] }
futures-util = "0.3.34"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
