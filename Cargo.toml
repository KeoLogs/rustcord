[package]
name = "rustcord"
version = "0.10.0"
edition = "2024"
license = "GPL-3.0-only"
description = "A native, customisable Discord client written in Rust"
# Test themes for the theme system; never packaged or bundled.
exclude = ["examples/themes"]

[dependencies]
anyhow = "1.0.104"
# Copied files for paste-to-upload (egui already pulls it in; no extra features).
arboard = { version = "3.6", default-features = false }
# QR login (remote_auth.rs): RSA-OAEP + SHA-256. Already in the tree as
# rustls' crypto provider; no extra features.
aws-lc-rs = { version = "1.19", default-features = false, features = ["aws-lc-sys"] }
base64 = "0.22"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
eframe = { version = "0.37.0", default-features = false, features = ["glow", "persistence", "default_fonts", "system_fonts", "accesskit", "clipboard", "links", "wayland", "x11"] }
egui_extras = { version = "0.37", features = ["all_loaders", "http"] }
# The disk image cache's loader (image_cache.rs) fetches with the same
# client egui_extras used; already in the tree.
ehttp = { version = "0.7", default-features = false }
egui_tiles = { version = "0.18", features = ["serde"] }
emojis = "0.9.1"
flate2 = "1.1.11"
futures-util = "0.3.34"
# Saved logins in the OS credential store (Credential Manager / Keychain /
# Secret Service via zbus, pure Rust: no libdbus needed). See accounts.rs.
keyring = "4.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
memory-stats = "1.2.0"
notify-rust = "4.19.0"
# QR login: encode the remote-auth URL (no image/svg renderers).
qrcode = { version = "0.14", default-features = false }
prost = { version = "0.14", default-features = false, features = ["derive", "std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "multipart", "stream"] }
rfd = "0.18.0"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
unicode-segmentation = "1.13.3"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
# Notification sound (sound.rs). The output device is only opened while a
# sound plays; no recording, no extra formats.
rodio = { version = "0.23.0", default-features = false, features = ["playback", "wav", "vorbis", "mp3"] }

# Ctrl+V with a file-only clipboard (paste.rs), the taskbar unread badge
# (taskbar.rs: ITaskbarList3 overlay icon, HWND from eframe's raw window
# handle) and the private working set in Settings → Performance
# (memstats.rs). Both crates are already in the tree via arboard / eframe.
[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# Smaller, faster release builds. panic = "abort": no unwinding tables or
# landing pads (smaller binary, less to map); nothing in RustCord catches
# panics. Debug symbols stay off (strip). Thin LTO, not fat: fat measured
# no clear RAM gain for 2.6x the build time. See scripts/memprobe-results.md.
[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
debug = false

[dev-dependencies]
tempfile = "3"
